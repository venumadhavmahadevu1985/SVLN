# Tests, then publishes all three sites to GitHub Pages in one deployment:
#   prod  branch → https://venumadhavmahadevu1985.github.io/SVLN/
#   stage branch → https://venumadhavmahadevu1985.github.io/SVLN/stage/
#   prod  branch → https://venumadhavmahadevu1985.github.io/SVLN/demo/  (sample data, no database)
# A push to either branch runs the tests on that branch and, if they pass, rebuilds the whole site
# from the latest commit of both branches.
name: Deploy prod + stage

on:
  push:
    branches: [prod, stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Unit + end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }

  rules:
    name: Firestore security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:rules

  build:
    needs: [test, rules]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out prod
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod

      - name: Check out stage
        uses: actions/checkout@v4
        with:
          ref: stage
          path: stage

      - name: Assemble site
        run: |
          mkdir -p _site/stage _site/demo
          cp -r prod/docs/. _site/
          cp -r stage/docs/. _site/stage/
          cp -r prod/docs/. _site/demo/
          touch _site/.nojekyll
          echo "prod  $(git -C prod rev-parse --short HEAD)"  >  _site/version.txt
          echo "stage $(git -C stage rev-parse --short HEAD)" >> _site/version.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
